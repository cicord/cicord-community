# Generated by the Cicord setup wizard.
apiVersion: cicord.dev/v1alpha1
kind: Project
metadata:
  name: cicord
spec:
  engine: ">=0.1.5 <0.2.0"   # roles.<key>.members, spec.analytics.portal
  source:
    provider: github
    repo: https://github.com/cicord/cicord-community
    branch: main
  runtime:
    url: https://community.cicord.dev
  writeBack:
    # Plugin settings and installs are committed directly; structural changes
    # (roles, channels, permissions) open a pull request for review.
    defaultMode: pullRequest
    policies:
      - paths: ["bots/**", "plugins/**"]
        mode: commit
      - paths: ["servers/**"]
        mode: pullRequest
  # The community portal served at / (https://community.cicord.dev): a fork of the reference
  # portal in portal/, built with `cicord portal build` and committed (CI checks that the
  # build matches the sources). Its theme, texts and links stay in servers/cicord.yaml.
  # Reference: https://cicord.dev/docs/portal/custom-portal/
  portal:
    path: ./portal/dist
