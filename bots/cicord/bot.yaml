# yaml-language-server: $schema=https://raw.githubusercontent.com/cicord/cicord/main/spec/schemas/bot.schema.json
#
# The Cicord bot of the community server. Plugins come from the official registry
# (github.com/cicord/cicord-plugins, signed index), pinned to an exact commit and integrity in
# cicord.lock (`cicord plugin add` / `cicord plugin update`). Grants are the capabilities each
# manifest requests: Cicord requires every one of them to be granted, and none beyond them.
# moderation, polls and github-releases come in a follow-up, once their 0.1.1 / 0.1.0 releases
# (mention and role-hierarchy hardening) are published and the runtime is updated.
# Reference: https://cicord.dev/docs/configuration/bot/ and https://cicord.dev/docs/plugins/official/

apiVersion: cicord.dev/v1alpha1
kind: Bot
metadata:
  name: cicord
spec:
  applicationId: "1574758169698377748"
  token:
    # Stored encrypted by the runtime (secret store); an environment variable with this
    # name takes precedence.
    secretRef: DISCORD_TOKEN_CICORD
  presence:
    status: online
    activity: { type: watching, name: the config repo }
  servers: [cicord]
  # The plugins' manifests already declare their intents; they are listed here so that the
  # privileged one is visible in review. ServerMembers (privileged): welcome and audit-log. No plugin here needs MessageContent: none of them reads what members write.
  intents: [ServerMessages, ServerMembers]
  plugins:
    # Greets new members in #general and gives them the Member role.
    - name: welcome
      source: cicord/welcome
      version: ^0.1.0
      grants: [discord.messages.send, discord.channels.read, discord.members.read,
               discord.roles.assign, discord.dm.send, portal.links, storage.kv]
      config:
        channel: general
        message: "Welcome {member} to {server}! Grab your roles in #welcome, and ask anything in #help."
        autoRole: member
        dmOnboarding: false       # no DM: there is no portal onboarding page on this server

    # Server events in #mod-log (joins with account age, leaves, roles, nicknames, deletions).
    - name: audit-log
      source: cicord/audit-log
      version: ^0.1.0
      grants: [discord.messages.send, discord.channels.read, storage.kv, scheduler, events.subscribe]
      config:
        channel: mod-log
        ignoredChannels: [staff, mod-log]

    # Opt-in roles panel in #welcome. Never list a role with permissions here.
    - name: reaction-roles
      source: cicord/reaction-roles
      version: ^0.1.0
      grants: [discord.messages.send, discord.messages.read, discord.channels.read,
               discord.roles.assign, discord.members.read, discord.reactions.manage, storage.kv]
      config:
        panels:
          - name: opt-in
            channel: welcome
            title: Pick your roles
            description: Click a button to add or remove a role.
            style: buttons
            mode: multiple
            options:
              - role: changelog-ping
                label: Changelog ping
                emoji: "🔔"
                description: "Get pinged in #changelog for every release"
              - role: plugin-author
                label: Plugin author
                emoji: "🧩"
                description: You write Cicord plugins

    # Private tickets with the staff (reports, private questions). Panel in #welcome, ticket
    # channels in the Tickets category, a summary of each closed ticket in #mod-log.
    - name: tickets
      source: cicord/tickets
      version: ^0.1.0
      grants: [discord.messages.send, discord.messages.read, discord.channels.read,
               discord.channels.manage, storage.kv, portal.routes]
      config:
        panelChannel: welcome
        category: tickets
        staffRoles: [maintainer, moderator]
        logChannel: mod-log
        panel:
          title: Talk to the team privately
          description: Report a member or a message, or ask something you would rather not post in public. Only you, the maintainers and the moderators see a ticket. Security vulnerabilities go to GitHub (SECURITY.md), not here.
          buttonLabel: Open a ticket
        maxOpenPerMember: 1
