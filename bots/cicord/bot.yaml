# yaml-language-server: $schema=https://raw.githubusercontent.com/cicord/cicord/main/spec/schemas/bot.schema.json
#
# The Cicord bot of the community server. Plugins come from the official registry
# (github.com/cicord/cicord-plugins, signed index), pinned to an exact commit and integrity in
# cicord.lock (`cicord plugin add` / `cicord plugin update`). Grants are the capabilities each
# manifest requests: Cicord requires every one of them to be granted, and none beyond them.
# moderation and polls need Cicord f50946a or later (role hierarchy and mention lists in the SDK).
# Reference: https://cicord.dev/docs/configuration/bot/ and https://cicord.dev/docs/plugins/official/

apiVersion: cicord.dev/v1alpha1
kind: Bot
metadata:
  name: cicord
spec:
  applicationId: "1574758169698377748"
  token:
    # Stored encrypted by the runtime (secret store); an environment variable with this
    # name takes precedence.
    secretRef: DISCORD_TOKEN_CICORD
  presence:
    status: online
    activity: { type: watching, name: the config repo }
  servers: [cicord]
  # The plugins' manifests already declare their intents; they are listed here so that the
  # privileged ones are visible in review. ServerMembers (privileged): welcome, moderation,
  # audit-log, and which members are bots for the analytics. MessageContent (privileged): the
  # analytics count attachments and polls (Discord strips them from messages without it);
  # no plugin here reads what members write. ServerPresences (privileged): the analytics'
  # presence aggregates (spec.analytics.presence in servers/cicord.yaml); only counts are
  # stored, never who is online. Each privileged intent must also be turned on in the
  # Discord developer portal (Bot → Privileged Gateway Intents) BEFORE this file is merged:
  # Discord refuses the connection otherwise.
  intents: [ServerMessages, ServerMembers, MessageContent, ServerPresences]
  plugins:
    # Greets new members in #general and gives them the Member role.
    - name: welcome
      source: cicord/welcome
      version: ^0.1.0
      grants: [discord.messages.send, discord.channels.read, discord.members.read,
               discord.roles.assign, discord.dm.send, portal.links, storage.kv]
      config:
        channel: general
        message: "Welcome {member} to {server}! Grab your roles in #welcome, and ask anything in #help."
        autoRole: member
        dmOnboarding: false       # no DM: there is no portal onboarding page on this server

    # Server events in #mod-log (joins with account age, leaves, roles, nicknames, deletions).
    - name: audit-log
      source: cicord/audit-log
      version: ^0.1.0
      grants: [discord.messages.send, discord.channels.read, storage.kv, scheduler, events.subscribe]
      config:
        channel: mod-log
        ignoredChannels: [staff, mod-log]
        events:
          moderation: false       # the moderation plugin already posts each case to #mod-log
          polls: false

    # Opt-in roles panel in #welcome. Never list a role with permissions here.
    - name: reaction-roles
      source: cicord/reaction-roles
      version: ^0.1.0
      grants: [discord.messages.send, discord.messages.read, discord.channels.read,
               discord.roles.assign, discord.members.read, discord.reactions.manage, storage.kv]
      config:
        panels:
          - name: opt-in
            channel: welcome
            title: Pick your roles
            description: Click a button to add or remove a role.
            style: buttons
            mode: multiple
            options:
              - role: changelog-ping
                label: Changelog ping
                emoji: "🔔"
                description: "Get pinged in #changelog for every release"
              - role: plugin-author
                label: Plugin author
                emoji: "🧩"
                description: You write Cicord plugins

    # Private tickets with the staff (reports, private questions). Panel in #welcome, ticket
    # channels in the Tickets category, a summary of each closed ticket in #mod-log.
    - name: tickets
      source: cicord/tickets
      version: ^0.2.0
      # 0.2 serves the community portal (portal/): members follow and open tickets, staff run
      # the queue. discord.members.read lists the staff (role.members(), ServerMembers); the
      # staff's conversation view reads ticket channels (MessageContent): both intents are
      # already enabled for this bot.
      grants: [discord.messages.send, discord.messages.read, discord.channels.read,
               discord.channels.manage, discord.members.read, storage.kv, portal.routes]
      config:
        panelChannel: welcome
        category: tickets
        staffRoles: [maintainer, moderator]
        logChannel: mod-log
        panel:
          title: Talk to the team privately
          description: Report a member or a message, or ask something you would rather not post in public. Only you, the maintainers and the moderators see a ticket. Security vulnerabilities go to GitHub (SECURITY.md), not here.
          buttonLabel: Open a ticket
        maxOpenPerMember: 1

    # /warn, /timeout, /kick, /ban, escalation and flood protection. Cases are logged to #mod-log.
    # A moderator can only act on members whose highest role is below theirs, never on staff
    # (only an admin can) nor on the server owner.
    - name: moderation
      source: cicord/moderation
      version: ^0.1.1
      grants: [discord.messages.send, discord.messages.manage, discord.channels.read,
               discord.members.read, discord.members.moderate, discord.dm.send, storage.kv,
               http.fetch, portal.routes, events.publish]
      config:
        logChannel: mod-log
        warningDays: 30
        escalation:
          - { warnings: 3, action: timeout, durationMinutes: 60 }
          - { warnings: 5, action: kick }
        flood:
          exemptRoles: [maintainer, moderator]
        # Joins, leaves and member updates are logged by audit-log (same channel).
        log: { joins: false, leaves: false, updates: false }

    # /poll in #general and #development. Members can only ping a member or a mentionable role;
    # maintainers and moderators can ping any role. @everyone never notifies.
    - name: polls
      source: cicord/polls
      version: ^0.1.1
      grants: [discord.messages.send, discord.messages.read, discord.channels.read,
               discord.threads.manage, storage.kv, scheduler, events.publish, portal.routes]
      config:
        channels: [general, development]
        managerRoles: [maintainer, moderator]

    # Release notes of cicord/cicord in #changelog, pinging the opt-in Changelog ping role
    # (only that role: it is not mentionable by members). Checked every 15 minutes, without a
    # GitHub token (4 requests per hour, well under GitHub's 60 per hour).
    - name: github-releases
      source: cicord/github-releases
      version: ^0.1.0
      grants: [discord.messages.send, discord.channels.read, storage.kv, scheduler, http.fetch]
      config:
        feeds:
          - repo: cicord/cicord
            channel: changelog
            mentionRole: changelog-ping
            label: Cicord
        pollMinutes: 15
        announceExisting: false   # announce releases published from now on only

    # Voice rooms on demand: joining "➕ Create a channel" (Voice category) gives the member a
    # voice channel of their own, deleted once it is empty. Owners manage it with /voice
    # (rename, limit, lock, permit, kick, transfer, claim); maintainers and moderators too.
    - name: voice-rooms
      source: cicord/voice-rooms
      version: ^0.1.0
      grants: [discord.channels.read, discord.channels.manage, discord.voice.move,
               discord.members.read, storage.kv, scheduler]
      config:
        hubs:
          - channel: create-room
            name: "🔊 {member}'s channel"
            allowedRoles: [maintainer]   # maintainers only for now; remove to open it to everyone
        staffRoles: [maintainer, moderator]
