# Format, lint, types and dead code of the community portal (portal/). The generated
# cicord-portal.yml runs its tests, rebuilds it and checks the committed build.
name: portal-quality
on:
  pull_request:
    paths: ["portal/**", ".github/workflows/portal-quality.yml"]
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/portal-quality.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # vp fmt --check, type-aware oxlint (correctness, suspicious, perf, React, jsx-a11y), tsc.
      - run: pnpm check
      # Unused files, exports and dependencies.
      - run: pnpm knip
