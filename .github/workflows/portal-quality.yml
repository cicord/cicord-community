# Format, lint, types and dead code of the community portal (portal/). The generated
# cicord-portal.yml runs its tests, rebuilds it and checks the committed build.
name: portal-quality
on:
  pull_request:
    paths: ["portal/**", ".github/workflows/portal-quality.yml"]
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/portal-quality.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # vp fmt --check, type-aware oxlint (correctness, suspicious, perf, React, jsx-a11y), tsc.
      - run: pnpm check
      # Unused files, exports and dependencies.
      - run: pnpm knip
