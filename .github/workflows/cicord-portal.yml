# Generated by `cicord portal init`.
# The runtime serves the committed portal build (cicord.yaml spec.portal.path). This job
# rebuilds it from the sources and fails when the committed build differs, so reviewing
# portal/src is enough to know what the runtime will serve.
name: cicord-portal
on:
  pull_request:
    paths: ["portal/**", "plugins/**", "bots/**", "cicord.lock"]
  push:
    branches: [main]
    paths: ["portal/**", "plugins/**", "bots/**", "cicord.lock"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The Cicord release the portal targets: 0.1.5 serves the portal analytics endpoint
      # (cicord.yaml spec.engine ">=0.1.5"). This job fails until v0.1.5 is tagged.
      - run: go install github.com/cicord/cicord/cmd/cicord@v0.1.5
      - name: The plugin route types match the plugins (src/cicord-routes.d.ts)
        working-directory: .
        run: cicord portal typegen --check --out portal/src/cicord-routes.d.ts
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: The committed build matches the sources
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::portal/dist is out of date: run 'cicord portal build' and commit it"
            exit 1
          fi
